<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Blind Engine Pro + Downloader Estável</title>
  <style>
    :root {
      --bg-main: #030712;
      --panel-bg: #0f172a;
      --card-bg: #020617;
      --border-color: #1e293b;
      --accent-cyan: #38bdf8;
      --accent-rose: #f43f5e;
      --accent-indigo: #818cf8;
      --accent-emerald: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
    }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 255px; background: #090d16; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 12px; }
    .nav-btn { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; border: none; background: none; text-align: left; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: #111827; color: #fff; }
    .main-content { flex: 1; display: flex; padding: 20px; overflow: hidden; }
    .dashboard { width: 100%; display: grid; grid-template-columns: 310px 1fr; gap: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .ai-left-panel { background: var(--panel-bg); border-radius: 16px; padding: 20px; overflow-y: auto; }
    .btn-action { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-emerald); color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .dl-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #020617; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; font-size: 0.8rem; }
    .dl-item-btn { background: #10b981; color: #fff; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-size: 0.7rem; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div style="font-weight:900; color:#fff; margin-bottom:20px;">TIKTOK ENGINE PRO</div>
    <button class="nav-btn active" id="btnFound">Found Footage</button>
    <button class="nav-btn" id="btnDownloader">Baixar TikTok</button>
  </aside>

  <main class="main-content">
    <div class="dashboard">
      <!-- Aba Downloader -->
      <div class="tab-content active" id="tabDownloader" style="width:100%;">
        <div class="ai-left-panel" style="max-width: 500px;">
          <h2>Downloader de Perfil</h2>
          <p style="font-size:0.8rem; color:var(--text-muted);">Use o botão abaixo no perfil alvo, depois cole aqui:</p>
          <textarea id="tiktokUrls" placeholder="Cole os links aqui..." style="width:100%; height:200px; background:#020617; color:#fff; border:1px solid #334155; border-radius:8px;"></textarea>
          <button id="downloadUrlsBtn" class="btn-action">⚡ Baixar Todos da Lista</button>
          <div id="dlStatus" style="margin-top:10px; font-weight:bold; color:var(--accent-emerald);"></div>
        </div>
        <div id="dlQueueList" style="overflow-y:auto; padding:0 20px;"></div>
      </div>
    </div>
  </main>

<script>
  // Troca de abas
  document.getElementById('btnDownloader').addEventListener('click', () => {
    document.getElementById('tabDownloader').classList.add('active');
    document.getElementById('btnDownloader').classList.add('active');
  });

  // Downloader Nativo
  const tiktokUrls = document.getElementById('tiktokUrls');
  const downloadUrlsBtn = document.getElementById('downloadUrlsBtn');
  const dlStatus = document.getElementById('dlStatus');
  const dlQueueList = document.getElementById('dlQueueList');

  async function downloadVideoDirectly(videoUrl, filename) {
    try {
      const response = await fetch(videoUrl);
      const blob = await response.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      return true;
    } catch (err) {
      window.open(videoUrl, '_blank');
      return true;
    }
  }

  downloadUrlsBtn.addEventListener('click', async () => {
    const rawText = tiktokUrls.value.trim();
    // Filtra para garantir que apenas links do TikTok sejam processados
    const urls = Array.from(new Set(rawText.split('\n').map(u => u.trim()).filter(u => u.includes('tiktok.com'))));
    
    if (urls.length === 0) { alert('Cole links válidos do TikTok.'); return; }

    downloadUrlsBtn.disabled = true;
    dlQueueList.innerHTML = '';
    
    for (let i = 0; i < urls.length; i++) {
      dlStatus.innerText = `Baixando (${i + 1}/${urls.length})...`;
      try {
        const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urls[i])}`);
        const data = await res.json();
        if (data.code === 0 && data.data && data.data.play) {
          const safeTitle = (data.data.title || `video_${i}`).substring(0, 20).replace(/[^a-z0-9]/gi, '_');
          const dlItem = document.createElement('div');
          dlItem.className = 'dl-item';
          dlItem.innerHTML = `<div class="dl-item-title">${i + 1}. ${data.data.title || 'Vídeo'}</div><span class="dl-item-btn">Baixando...</span>`;
          dlQueueList.appendChild(dlItem);
          
          await downloadVideoDirectly(data.data.play, `${safeTitle}.mp4`);
          dlItem.querySelector('.dl-item-btn').innerText = '✅ OK';
        }
      } catch (e) { console.warn(e); }
      await new Promise(r => setTimeout(r, 1500));
    }
    dlStatus.innerText = 'Download finalizado!';
    downloadUrlsBtn.disabled = false;
  });
</script>
</body>
</html>
